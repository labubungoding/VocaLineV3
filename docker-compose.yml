name: vocaline

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vocaline}
      POSTGRES_USER: ${POSTGRES_USER:-vocaline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8"
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    logging: *logging

  backend:
    build: ./backend
    image: vocaline-backend:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vocaline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vocaline}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      APP_URL: ${APP_URL:?Isi APP_URL di .env, contoh https://app.domain-anda.id}
      EXTRA_CORS_ORIGINS: ${EXTRA_CORS_ORIGINS:-}
      ML_BASE_URL: http://ml:8000
      ML_API_KEY: ${ML_API_KEY:?Isi ML_API_KEY di .env}
      ML_TIMEOUT: ${ML_TIMEOUT:-25s}
      CRON_SECRET: ${CRON_SECRET:-}
      HOSPITAL_TIMEZONE: ${HOSPITAL_TIMEZONE:-Asia/Jakarta}
      HOSPITAL_ADAPTER: ${HOSPITAL_ADAPTER:-mock}
      SIMRS_BASE_URL: ${SIMRS_BASE_URL:-}
      SIMRS_API_KEY: ${SIMRS_API_KEY:-}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-2500000}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      INVITE_TOKEN_HOURS: ${INVITE_TOKEN_HOURS:-24}
      RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:-60}
      SUPERADMIN_ALLOWLIST: ${SUPERADMIN_ALLOWLIST:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_HELO_NAME: ${SMTP_HELO_NAME:-vocaline.local}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-VocaLine}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [internal, edge]
    logging: *logging

  ml:
    build:
      context: ./ml
      args:
        INSTALL_PIPER: ${ML_INSTALL_PIPER:-0}
    image: vocaline-ml:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      ML_API_KEY: ${ML_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b,qwen/qwen3.8-27b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      STT_PROVIDER: ${STT_PROVIDER:-groq}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      INTENT_MODEL_DIR: ${INTENT_MODEL_DIR:-models/indobert-intent}
      EMOTION_MODEL_DIR: ${EMOTION_MODEL_DIR:-models/indobert-emotion}
      TTS_PROVIDER: ${TTS_PROVIDER:-browser}
      PIPER_MODEL_PATH: ${PIPER_MODEL_PATH:-models/tts/id_ID-news_tts-medium.onnx}
      VINE_DEMO_PAGE: "0"
    volumes:
      - ./ml/models:/app/models:ro,z
      - ml-cache:/home/app/.cache
    networks: [internal, edge]
    logging: *logging

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: vocaline-web:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    networks: [edge]
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
    networks: [edge]
    logging: *logging

  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [edge]
    logging: *logging

networks:
  internal:
    internal: true
  edge: {}

volumes:
  pgdata:
  ml-cache:
