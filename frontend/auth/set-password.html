<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f6e74" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/apps/auth/pages/login.css" />
    <title>Buat kata sandi · VocalLine</title>
  </head>
  <body>
    <div class="login">
      <div class="card login__card">
        <div class="login__head">
          <img class="login__logo" src="/logo.png" alt="Vocaline" />
          <h1 id="app-setpw-title" class="login__title">Buat kata sandi</h1>
          <p id="app-setpw-sub" class="muted login__sub">Memeriksa tautan…</p>
        </div>

        <p id="app-setpw-message" role="alert" class="alert" hidden></p>

        <form id="app-setpw-form" class="login__form" novalidate hidden>
          <label class="lbl">
            Kata sandi baru
            <input id="app-setpw-password" class="fi" type="password" required minlength="8" autocomplete="new-password" />
          </label>
          <label class="lbl">
            Ulangi kata sandi
            <input id="app-setpw-password2" class="fi" type="password" required minlength="8" autocomplete="new-password" />
          </label>
          <button id="app-setpw-submit" type="submit" class="btn btn--primary btn--block login__submit">Simpan kata sandi</button>
        </form>

        <form id="app-request-form" class="login__form" novalidate hidden>
          <label class="lbl">
            Email resmi rumah sakit
            <input id="app-request-email" class="fi" type="email" required placeholder="it@rumahsakit.id" autocomplete="email" />
          </label>
          <button id="app-request-submit" type="submit" class="btn btn--primary btn--block login__submit">Kirim tautan verifikasi</button>
          <p class="muted login__hint">Hanya untuk superadmin pertama. Akun perawat dibuat superadmin lewat undangan email.</p>
        </form>

        <p class="muted login__hint"><a href="/login">Kembali ke halaman masuk</a></p>
      </div>
    </div>
    <script type="module" src="/src/apps/auth/pages/setPassword.js"></script>
  </body>
</html>
