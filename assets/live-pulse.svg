<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="120">
  <defs>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#041217" />
      <stop offset="50%" stop-color="#08232c" />
      <stop offset="100%" stop-color="#041217" />
    </linearGradient>

    <style>
      .radar-red {
        animation: radarPing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .radar-orange {
        animation: radarPing 2.2s cubic-bezier(0, 0, 0.2, 1) infinite 0.4s;
      }
      .radar-yellow {
        animation: radarPing 2.6s cubic-bezier(0, 0, 0.2, 1) infinite 0.8s;
      }
      .radar-green {
        animation: radarPing 3.0s cubic-bezier(0, 0, 0.2, 1) infinite 1.2s;
      }

      @keyframes radarPing {
        0% { transform: scale(0.9); opacity: 0.9; }
        70%, 100% { transform: scale(2.2); opacity: 0; }
      }
    </style>
  </defs>

  <rect width="920" height="120" rx="16" fill="url(#barBg)" stroke="#115e59" stroke-width="1.2" />

  <!-- Title section -->
  <text x="35" y="42" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2dd4bf" letter-spacing="1.5">
    4-LEVEL REALTIME INTELLIGENT TRIAGE ENGINE
  </text>
  <text x="35" y="65" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
    Automatic intent prioritization by IndoBERT + Emergency Red Button bypass (<span fill="#38bdf8">&lt;25ms</span> latency)
  </text>

  <!-- Level 1: RED -->
  <g transform="translate(480, 60)">
    <circle cx="0" cy="0" r="14" fill="#ef4444" class="radar-red" opacity="0.3" />
    <circle cx="0" cy="0" r="10" fill="#dc2626" />
    <text x="22" y="-3" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="800" fill="#fca5a5">MERAH</text>
    <text x="22" y="11" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#f87171">Darurat Medis (Code Red)</text>
  </g>

  <!-- Level 2: ORANGE -->
  <g transform="translate(685, 60)">
    <circle cx="0" cy="0" r="14" fill="#f97316" class="radar-orange" opacity="0.3" />
    <circle cx="0" cy="0" r="10" fill="#ea580c" />
    <text x="22" y="-3" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="800" fill="#fdba74">ORANYE</text>
    <text x="22" y="11" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#fb923c">Bantuan Mendesak</text>
  </g>

  <!-- Level 3 & 4 (bottom small pills) -->
  <g transform="translate(35, 95)">
    <!-- Yellow -->
    <circle cx="6" cy="-4" r="5" fill="#eab308" />
    <text x="18" y="0" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#fde047">KUNING</text>
    <text x="68" y="0" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Keluhan Ringan &amp; Fisiologis</text>

    <!-- Green -->
    <circle cx="240" cy="-4" r="5" fill="#22c55e" />
    <text x="252" y="0" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#86efac">HIJAU</text>
    <text x="294" y="0" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Percakapan Santai &amp; Teman Bicara</text>
  </g>
</svg>
