<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 140" width="100%" height="140">
  <defs>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04141c" />
      <stop offset="50%" stop-color="#092733" />
      <stop offset="100%" stop-color="#031017" />
    </linearGradient>

    <style>
      .radar-red {
        animation: radarPing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .radar-orange {
        animation: radarPing 2.2s cubic-bezier(0, 0, 0.2, 1) infinite 0.4s;
      }
      .radar-yellow {
        animation: radarPing 2.6s cubic-bezier(0, 0, 0.2, 1) infinite 0.8s;
      }
      .radar-green {
        animation: radarPing 3.0s cubic-bezier(0, 0, 0.2, 1) infinite 1.2s;
      }

      @keyframes radarPing {
        0% { transform: scale(0.9); opacity: 0.9; }
        70%, 100% { transform: scale(2.2); opacity: 0; }
      }

      .pulse-dot {
        animation: dotGlow 2s ease-in-out infinite alternate;
      }
      @keyframes dotGlow {
        0% { filter: drop-shadow(0 0 2px rgba(16,185,129,0.5)); }
        100% { filter: drop-shadow(0 0 8px rgba(56,189,248,0.9)); }
      }
    </style>
  </defs>

  <rect width="1060" height="140" rx="18" fill="url(#barBg)" stroke="#115e59" stroke-width="1.3" />

  <!-- Title section -->
  <g transform="translate(35, 42)">
    <text font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#2dd4bf" letter-spacing="1.5">
      🏥 4-TIER MULTIMODAL INTELLIGENT CLINICAL TRIAGE ENGINE
    </text>
    <text y="24" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">
      Prioritisasi otomatis berbasis IndoBERT Intent NLP + Emergency Red Button bypass (&lt;25ms)
    </text>
  </g>

  <!-- Level 1: RED -->
  <g transform="translate(560, 50)">
    <circle cx="0" cy="0" r="16" fill="#ef4444" class="radar-red" opacity="0.3" />
    <circle cx="0" cy="0" r="11" fill="#dc2626" />
    <text x="24" y="-3" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#fca5a5">MERAH (Level 1)</text>
    <text x="24" y="13" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f87171">Darurat Medis (&lt;25ms)</text>
  </g>

  <!-- Level 2: ORANGE -->
  <g transform="translate(820, 50)">
    <circle cx="0" cy="0" r="16" fill="#f97316" class="radar-orange" opacity="0.3" />
    <circle cx="0" cy="0" r="11" fill="#ea580c" />
    <text x="24" y="-3" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#fdba74">ORANYE (Level 2)</text>
    <text x="24" y="13" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fb923c">Bantuan Cepat (&lt;450ms)</text>
  </g>

  <!-- Lower Row: Yellow, Green, Realtime Latency Indicator -->
  <g transform="translate(35, 110)">
    <!-- Yellow -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="-4" r="6" fill="#eab308" />
      <text x="18" y="0" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#fde047">KUNING (Level 3):</text>
      <text x="135" y="0" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">Kebutuhan Harian &amp; Fisiologis</text>
    </g>

    <!-- Green -->
    <g transform="translate(350, 0)">
      <circle cx="6" cy="-4" r="6" fill="#22c55e" />
      <text x="18" y="0" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#86efac">HIJAU (Level 4):</text>
      <text x="122" y="0" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">Teman Bicara &amp; Edukasi Pasien</text>
    </g>

    <!-- Latency Badge -->
    <g transform="translate(730, 0)">
      <rect x="0" y="-14" width="260" height="22" rx="11" fill="#083344" stroke="#0ea5e9" stroke-width="0.8" />
      <circle cx="14" cy="-3" r="4" fill="#38bdf8" class="pulse-dot" />
      <text x="26" y="0" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#7dd3fc">
        Time-to-First-Token: &lt;650ms (SSE Stream)
      </text>
    </g>
  </g>
</svg>
