<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05131a" />
      <stop offset="50%" stop-color="#0a252f" />
      <stop offset="100%" stop-color="#030c10" />
    </linearGradient>

    <linearGradient id="glowTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .ecg-path {
        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;
        animation: ecgAnim 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes ecgAnim {
        0% { stroke-dashoffset: 1400; opacity: 0; }
        15% { opacity: 1; }
        70% { stroke-dashoffset: 0; opacity: 1; }
        90% { stroke-dashoffset: 0; opacity: 0.2; }
        100% { stroke-dashoffset: -1400; opacity: 0; }
      }

      .pulse-circle {
        animation: pulseScale 2.4s ease-in-out infinite;
        transform-origin: center;
      }
      @keyframes pulseScale {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.2); opacity: 1; }
      }

      .bar-anim1 { animation: soundBar 1.2s ease-in-out infinite alternate; }
      .bar-anim2 { animation: soundBar 0.9s ease-in-out infinite alternate 0.2s; }
      .bar-anim3 { animation: soundBar 1.5s ease-in-out infinite alternate 0.4s; }
      .bar-anim4 { animation: soundBar 1.1s ease-in-out infinite alternate 0.1s; }
      .bar-anim5 { animation: soundBar 1.3s ease-in-out infinite alternate 0.3s; }
      @keyframes soundBar {
        0% { transform: scaleY(0.25); }
        100% { transform: scaleY(1); }
      }

      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite;
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(16,185,129,0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(6,182,212,0.8)); }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="1060" height="280" rx="20" fill="url(#bgGrad)" stroke="#134e4a" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="70" r="100" fill="#065f46" opacity="0.3" filter="url(#softGlow)" />
  <circle cx="920" cy="200" r="120" fill="#0369a1" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="530" cy="140" r="150" fill="#0f766e" opacity="0.15" filter="url(#softGlow)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.8">
    <line x1="40" y1="50" x2="1020" y2="50" />
    <line x1="40" y1="100" x2="1020" y2="100" />
    <line x1="40" y1="150" x2="1020" y2="150" />
    <line x1="40" y1="200" x2="1020" y2="200" />
    <line x1="40" y1="250" x2="1020" y2="250" />
    <line x1="150" y1="20" x2="150" y2="260" />
    <line x1="340" y1="20" x2="340" y2="260" />
    <line x1="530" y1="20" x2="530" y2="260" />
    <line x1="720" y1="20" x2="720" y2="260" />
    <line x1="910" y1="20" x2="910" y2="260" />
  </g>

  <!-- Animated ECG Line across 1060px -->
  <path class="ecg-path"
        d="M 40,215 L 260,215 L 280,215 L 290,185 L 302,245 L 315,145 L 330,235 L 342,205 L 352,215 L 670,215 L 685,215 L 695,185 L 707,245 L 720,140 L 735,240 L 747,205 L 758,215 L 1020,215"
        fill="none" stroke="url(#glowTeal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Top Hackathon Badge -->
  <g transform="translate(530, 42)">
    <rect x="-210" y="-16" width="420" height="32" rx="16" fill="#0f2932" stroke="#14b8a6" stroke-width="1.2" class="badge-glow" />
    <circle cx="-180" cy="0" r="5" fill="#10B981" class="pulse-circle" />
    <text x="-160" y="5" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="12" font-weight="800" fill="#a7f3d0" letter-spacing="2">
      HACKATHON 2026 • TIM LABUBU NGODING
    </text>
  </g>

  <!-- Main Title: VOCALINE V3.0 -->
  <g transform="translate(530, 115)">
    <!-- Soft Glow Under-Text -->
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Montserrat, Arial, sans-serif" font-size="54" font-weight="900" fill="#10B981" opacity="0.4" filter="url(#glow)" letter-spacing="4">
      VOCALINE V3.0
    </text>
    <!-- Sharp Front Text -->
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Montserrat, Arial, sans-serif" font-size="54" font-weight="900" fill="url(#glowTeal)" letter-spacing="4">
      VOCALINE V3.0
    </text>
  </g>

  <!-- Subtitle -->
  <text x="530" y="152" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500" fill="#94a3b8" letter-spacing="1.5">
    AI-Powered Smart Hospital Nurse Call &amp; Patient Companion System
  </text>

  <!-- Secondary Meta Tags / Tech Pill Indicators -->
  <g transform="translate(530, 182)">
    <!-- Pill 1: Vine AI Voice -->
    <g transform="translate(-280, 0)">
      <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#0c4a45" stroke="#10b981" stroke-width="0.9" />
      <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">🎙️ Vine AI Voice</text>
    </g>

    <!-- Pill 2: Dual IndoBERT -->
    <g transform="translate(-90, 0)">
      <rect x="-75" y="-12" width="150" height="24" rx="12" fill="#0c354a" stroke="#0ea5e9" stroke-width="0.9" />
      <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">🧠 Dual IndoBERT</text>
    </g>

    <!-- Pill 3: Zero-Dep Backend -->
    <g transform="translate(100, 0)">
      <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#2d1f4d" stroke="#8b5cf6" stroke-width="0.9" />
      <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#c4b5fd">⚡ Zero-Dep Node 22</text>
    </g>

    <!-- Pill 4: Cloudflare Tunnel -->
    <g transform="translate(290, 0)">
      <rect x="-75" y="-12" width="150" height="24" rx="12" fill="#432611" stroke="#f59e0b" stroke-width="0.9" />
      <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fcd34d">🛡️ Cloudflared Zero-Trust</text>
    </g>
  </g>

  <!-- Animated Soundwave Equalizer (Right side decoration) -->
  <g transform="translate(970, 115) scale(1, -1)">
    <g transform="translate(0, 0)" class="bar-anim1"><rect x="-16" y="0" width="4" height="24" rx="2" fill="#10B981" /></g>
    <g transform="translate(0, 0)" class="bar-anim2"><rect x="-8" y="0" width="4" height="42" rx="2" fill="#06B6D4" /></g>
    <g transform="translate(0, 0)" class="bar-anim3"><rect x="0" y="0" width="4" height="32" rx="2" fill="#3B82F6" /></g>
    <g transform="translate(0, 0)" class="bar-anim4"><rect x="8" y="0" width="4" height="46" rx="2" fill="#06B6D4" /></g>
    <g transform="translate(0, 0)" class="bar-anim5"><rect x="16" y="0" width="4" height="20" rx="2" fill="#10B981" /></g>
  </g>

  <!-- Animated Soundwave Equalizer (Left side decoration) -->
  <g transform="translate(90, 115) scale(1, -1)">
    <g transform="translate(0, 0)" class="bar-anim5"><rect x="-16" y="0" width="4" height="20" rx="2" fill="#10B981" /></g>
    <g transform="translate(0, 0)" class="bar-anim4"><rect x="-8" y="0" width="4" height="46" rx="2" fill="#06B6D4" /></g>
    <g transform="translate(0, 0)" class="bar-anim3"><rect x="0" y="0" width="4" height="32" rx="2" fill="#3B82F6" /></g>
    <g transform="translate(0, 0)" class="bar-anim2"><rect x="8" y="0" width="4" height="42" rx="2" fill="#06B6D4" /></g>
    <g transform="translate(0, 0)" class="bar-anim1"><rect x="16" y="0" width="4" height="24" rx="2" fill="#10B981" /></g>
  </g>
</svg>
