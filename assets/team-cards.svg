    </text>
    <!-- Secondary Role -->
    <rect x="24" y="160" width="147" height="20" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="0.7" />
    <text x="97" y="174" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#bfdbfe">
      Node 22 &amp; PostgreSQL
    </text>
    <!-- Responsibilities -->
    <text x="97" y="202" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">
      Zero-Dep Architecture,
    </text>
    <text x="97" y="217" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">
      SSE Realtime Hub &amp; Scrypt
    </text>
  </g>
</svg>
