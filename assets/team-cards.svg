    </g>
    <!-- Full Name (No Truncation) -->
    <text x="97" y="116" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
      KHAIRUNNISA MUHARDI
    </text>
    <!-- Primary Role -->
    <rect x="22" y="130" width="151" height="24" rx="12" fill="#500724" stroke="#ec4899" stroke-width="0.9" />
    <text x="97" y="146" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#f472b6" letter-spacing="0.6">
      UI/UX DESIGNER
    </text>
    <!-- Secondary Role -->
    <rect x="24" y="160" width="147" height="20" rx="10" fill="#3b0764" stroke="#db2777" stroke-width="0.7" />
    <text x="97" y="174" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#fbcfe8">
      Figma Design System
    </text>
    <!-- Responsibilities -->
    <text x="97" y="202" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">
      3-Persona Experience,
    </text>
    <text x="97" y="217" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">
      Elderly Ergonomics &amp; Colors
    </text>
  </g>

  <!-- CARD 5: AKHTAR FADHILAH -->
  <g class="card-item" transform="translate(855, 12)">
    <rect width="195" height="245" rx="16" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.4" filter="url(#cardShadow)" />
    <!-- Avatar -->
    <g class="team-avatar av-delay5" transform="translate(97, 56)">
      <circle cx="0" cy="0" r="32" fill="#172554" stroke="#3b82f6" stroke-width="2.5" />
      <text x="0" y="9" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="24">⚙️</text>
    </g>
    <!-- Full Name -->
    <text x="97" y="116" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
      AKHTAR FADHILAH
    </text>
    <!-- Primary Role -->
    <rect x="22" y="130" width="151" height="24" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="0.9" />
    <text x="97" y="146" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#93c5fd" letter-spacing="0.6">
