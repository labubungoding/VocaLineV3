<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 270" width="100%" height="270">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d27" />
      <stop offset="100%" stop-color="#040f15" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      .team-avatar {
        animation: floatAvatar 3.5s ease-in-out infinite alternate;
      }
      .av-delay1 { animation-delay: 0.1s; }
      .av-delay2 { animation-delay: 0.4s; }
      .av-delay3 { animation-delay: 0.7s; }
      .av-delay4 { animation-delay: 1.0s; }
      .av-delay5 { animation-delay: 1.3s; }

      @keyframes floatAvatar {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }

      .card-item {
        transition: transform 0.3s ease;
      }
      .card-item:hover {
        transform: translateY(-4px);
      }
    </style>
  </defs>

  <!-- CARD 1: ALKHALIFI ZIKRI HADY -->
  <g class="card-item" transform="translate(15, 12)">
    <rect width="195" height="245" rx="16" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.4" filter="url(#cardShadow)" />
    <!-- Avatar -->
    <g class="team-avatar av-delay1" transform="translate(97, 56)">
      <circle cx="0" cy="0" r="32" fill="#064e3b" stroke="#10b981" stroke-width="2.5" />
      <text x="0" y="9" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="24">👑</text>
    </g>
    <!-- Full Name (No Truncation) -->
    <text x="97" y="116" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
      ALKHALIFI ZIKRI HADY
    </text>
    <!-- Primary Role -->
    <rect x="18" y="130" width="159" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="0.9" />
    <text x="97" y="146" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#6ee7b7" letter-spacing="0.6">
      PROJECT MANAGER
    </text>
    <!-- Secondary Role -->
    <rect x="24" y="160" width="147" height="20" rx="10" fill="#022c22" stroke="#059669" stroke-width="0.7" />
    <text x="97" y="174" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#a7f3d0">
      QA &amp; Security Tester
    </text>
    <!-- Responsibilities -->
    <text x="97" y="202" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">
      Sprint Lead, E2E Testing,
    </text>
    <text x="97" y="217" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">
      Patient Data Guardrails
    </text>
  </g>

  <!-- CARD 2: DZHILLAN DZHALILA -->
  <g class="card-item" transform="translate(225, 12)">
    <rect width="195" height="245" rx="16" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1.4" filter="url(#cardShadow)" />
    <!-- Avatar -->
    <g class="team-avatar av-delay2" transform="translate(97, 56)">
      <circle cx="0" cy="0" r="32" fill="#083344" stroke="#06b6d4" stroke-width="2.5" />
      <text x="0" y="9" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="24">💻</text>
    </g>
    <!-- Full Name -->
    <text x="97" y="116" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
      DZHILLAN DZHALILA
    </text>
    <!-- Primary Role -->
    <rect x="22" y="130" width="151" height="24" rx="12" fill="#083344" stroke="#06b6d4" stroke-width="0.9" />
    <text x="97" y="146" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#67e8f9" letter-spacing="0.6">
      FRONT END DEV
    </text>
    <!-- Secondary Role -->
    <rect x="24" y="160" width="147" height="20" rx="10" fill="#042f2e" stroke="#0891b2" stroke-width="0.7" />
    <text x="97" y="174" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#a5f3fc">
      Tablet UI &amp; Voice Web
    </text>
    <!-- Responsibilities -->
    <text x="97" y="202" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">
      Silero VAD, Vine Blob,
    </text>
    <text x="97" y="217" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">
      Nurse Station Dashboard
    </text>
  </g>

  <!-- CARD 3: RENDI WAHYUDI -->
  <g class="card-item" transform="translate(435, 12)">
    <rect width="195" height="245" rx="16" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.4" filter="url(#cardShadow)" />
    <!-- Avatar -->
    <g class="team-avatar av-delay3" transform="translate(97, 56)">
      <circle cx="0" cy="0" r="32" fill="#2e1065" stroke="#8b5cf6" stroke-width="2.5" />
      <text x="0" y="9" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="24">🧠</text>
    </g>
    <!-- Full Name -->
    <text x="97" y="116" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
      RENDI WAHYUDI
    </text>
    <!-- Primary Role -->
    <rect x="20" y="130" width="155" height="24" rx="12" fill="#2e1065" stroke="#8b5cf6" stroke-width="0.9" />
    <text x="97" y="146" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#c4b5fd" letter-spacing="0.6">
      MACHINE LEARNING
    </text>
    <!-- Secondary Role -->
    <rect x="24" y="160" width="147" height="20" rx="10" fill="#1e1b4b" stroke="#7c3aed" stroke-width="0.7" />
    <text x="97" y="174" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#ddd6fe">
      IndoBERT &amp; Whisper STT
    </text>
    <!-- Responsibilities -->
    <text x="97" y="202" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">
      Dual IndoBERT Triage,
    </text>
    <text x="97" y="217" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">
      Gemini Guardrails &amp; Prosody
    </text>
  </g>

  <!-- CARD 4: KHAIRUNNISA MUHARDI -->
  <g class="card-item" transform="translate(645, 12)">
    <rect width="195" height="245" rx="16" fill="url(#cardBg)" stroke="#ec4899" stroke-width="1.4" filter="url(#cardShadow)" />
    <!-- Avatar -->
    <g class="team-avatar av-delay4" transform="translate(97, 56)">
